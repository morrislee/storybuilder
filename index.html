<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <style>
    :root {
      --blue: #125cbd;
      --green: #12753a;
      --amber: #a65a00;
      --red: #bd2020;
      --ink: #18212c;
      --muted: #667181;
      --border: #d4dae1;
      --page: #f2f5f8;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      color: var(--ink);
      background: var(--page);
      font: 16px/1.4 Arial, sans-serif;
    }
    main { max-width: 820px; margin: auto; padding: 18px 12px 46px; }
    h1 { margin: 0; font-size: 26px; }
    .intro { margin: 4px 0 16px; color: var(--muted); }
    .progress {
      position: sticky;
      top: 0;
      z-index: 5;
      margin: 0 -12px 12px;
      padding: 9px 12px;
      color: #fff;
      background: #26364b;
      text-align: center;
      font-size: 14px;
      font-weight: 700;
    }
    .section {
      margin: 12px 0;
      padding: 16px;
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 12px;
    }
    h2 { margin: 0 0 4px; font-size: 19px; }
    .section-note { margin: 0 0 12px; color: var(--muted); font-size: 14px; }
    .item { padding: 13px 0; border-top: 1px solid #e5e9ed; }
    .item:first-of-type { border-top: 0; }
    .item-label { margin-bottom: 9px; font-weight: 700; }
    .choices { display: flex; flex-wrap: wrap; gap: 7px; }
    .choice { cursor: pointer; }
    .choice input { position: absolute; opacity: 0; pointer-events: none; }
    .choice span {
      display: inline-block;
      min-width: 92px;
      padding: 10px 12px;
      border: 1px solid #9da8b5;
      border-radius: 8px;
      background: #fff;
      text-align: center;
      font-size: 14px;
      font-weight: 700;
    }
    .choice input:checked + span { color: #fff; background: var(--green); border-color: var(--green); }
    .choice input:focus-visible + span { outline: 3px solid #d7e7ff; outline-offset: 2px; border-color: var(--blue); }
    .choice input:disabled + span { cursor: default; opacity: 0.68; }
    .choice input[value="NO"]:checked + span,
    .choice input[value="OUT OF SPEC"]:checked + span,
    .choice input[value="CRACKED / DAMAGED"]:checked + span,
    .choice input[value="CANNOT GREASE"]:checked + span,
    .choice input[value="POOR"]:checked + span,
    .choice input[value="REPLACE"]:checked + span,
    .choice input[value="DAMAGE / OTHER"]:checked + span,
    .choice input[value="LEAK FOUND"]:checked + span { background: var(--red); border-color: var(--red); }
    .choice input[value="N/A"]:checked + span,
    .choice input[value="UNABLE TO TEST"]:checked + span,
    .choice input[value="CANNOT TEST"]:checked + span,
    .choice input[value="CUSTOMER DECLINED"]:checked + span,
    .choice input[value="CUSTOMER DECLINED CHECK"]:checked + span,
    .choice input[value="NOT REQUIRED"]:checked + span { background: #586372; border-color: #586372; }
    .choice input[value="FULL"]:checked + span { background: var(--blue); border-color: var(--blue); }
    .choice input[value="FAIR"]:checked + span,
    .choice input[value="CHARGE & RETEST"]:checked + span { background: var(--amber); border-color: var(--amber); }
    .choice input[value="UNEVEN WEAR"]:checked + span { background: var(--amber); border-color: var(--amber); }
    .choice.tire-rotation-choice input[value="NO"]:checked + span { background: var(--green); border-color: var(--green); }
    .choice.tire-rotation-choice input[value="YES"]:checked + span { background: var(--amber); border-color: var(--amber); }
    .detail { display: none; margin-top: 10px; padding: 10px; background: #fff3f3; border-radius: 8px; }
    .detail.visible { display: block; }
    .detail label { display: block; color: #8b1717; font-weight: 700; }
    .suggestion-set, .exception-suggestions {
      margin: 8px 0 0;
      color: #667181;
      font-size: 12px;
      font-weight: 400;
      line-height: 1.35;
    }
    .suggestion-set strong, .exception-suggestions strong { color: #4d596a; }
    input, select, textarea {
      width: 100%;
      margin-top: 5px;
      padding: 10px;
      border: 1px solid #aab4c0;
      border-radius: 8px;
      background: white;
      color: var(--ink);
      font: inherit;
    }
    input::placeholder, textarea::placeholder { color: #aab4c0; opacity: 1; }
    .battery-voltage::placeholder { color: #c5ccd4; }
    input:focus, select:focus, textarea:focus { outline: 3px solid #d7e7ff; border-color: var(--blue); }
    .measurement-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
    .measurement-grid.four { grid-template-columns: repeat(4, minmax(0, 1fr)); }
    .tire-map {
      display: grid;
      grid-template-columns: minmax(105px, 1fr) 132px minmax(105px, 1fr);
      grid-template-rows: auto 1fr 1fr;
      align-items: center;
      gap: 12px 16px;
      max-width: 560px;
      margin: 0 auto;
    }
    .tire-map-heading { grid-column: 1 / -1; color: var(--muted); text-align: center; font-size: 13px; font-weight: 700; }
    .tire-position { display: block; text-align: center; font-size: 12px; font-weight: 700; }
    .tread-control { display: flex; align-items: center; gap: 5px; margin-top: 5px; }
    .tread-control select { min-width: 0; margin: 0; text-align: center; font-size: 18px; font-weight: 700; }
    .tread-unit { white-space: nowrap; font-size: 15px; font-weight: 700; }
    .all-tread-entry { max-width: 300px; margin: 0 auto 14px; padding: 10px; border: 1px solid #cbd7e5; border-radius: 8px; background: #f4f8fc; text-align: center; }
    .all-tread-entry .tread-control { justify-content: center; }
    .all-tread-entry select { width: 104px; }
    .tread-heading-row { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px; }
    .tread-heading-row .item-label { margin-bottom: 0; }
    .dually-toggle span { min-width: 0; }
    .driver-front { grid-column: 1; grid-row: 2; }
    .passenger-front { grid-column: 3; grid-row: 2; }
    .driver-rear-pair { grid-column: 1; grid-row: 3; }
    .passenger-rear-pair { grid-column: 3; grid-row: 3; }
    .rear-pair { display: grid; grid-template-columns: minmax(0, 1fr); gap: 6px; }
    .rear-pair-heading { display: none; }
    .rear-tread { display: block; text-align: center; font-size: 12px; font-weight: 700; }
    .driver-rear-inner, .passenger-rear-inner { display: none; }
    .dually-rear-label { display: none; }
    .tire-map.is-dually { grid-template-rows: auto 1fr 1fr; }
    .tire-map.is-dually .rear-pair { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 5px; }
    .tire-map.is-dually .rear-pair-heading { display: block; grid-column: 1 / -1; color: var(--muted); font-size: 11px; font-weight: 700; letter-spacing: .02em; }
    .tire-map.is-dually .driver-rear-inner,
    .tire-map.is-dually .passenger-rear-inner { display: block; }
    .tire-map.is-dually .standard-rear-label { display: none; }
    .tire-map.is-dually .dually-rear-label { display: block; }
    .tire-map.is-dually .rear-tread .tread-control { gap: 2px; }
    .tire-map.is-dually .rear-tread .tread-control select { padding: 8px 4px; font-size: 16px; }
    .tire-map.is-dually .rear-tread .tread-unit { font-size: 12px; }
    .rotation-completed { margin-top: 10px; }
    .car-top {
      position: relative;
      grid-column: 2;
      grid-row: 2 / 4;
      width: 120px;
      height: 270px;
      margin: 0 auto;
      border: 5px solid #41536a;
      border-radius: 48px 48px 34px 34px;
      background: linear-gradient(to bottom, #dce7f3 0 28%, #b8c7d8 28% 32%, #dce7f3 32% 73%, #b8c7d8 73% 77%, #dce7f3 77% 100%);
    }
    .car-top::before, .car-top::after {
      position: absolute;
      width: 13px;
      height: 58px;
      border-radius: 5px;
      background: #26364b;
      content: '';
    }
    .car-top::before { top: 39px; left: -18px; box-shadow: 0 119px 0 #26364b; }
    .car-top::after { top: 39px; right: -18px; box-shadow: 0 119px 0 #26364b; }
    .tire-map.is-dually .car-top::before { box-shadow: 0 119px 0 #26364b, -16px 119px 0 #26364b; }
    .tire-map.is-dually .car-top::after { box-shadow: 0 119px 0 #26364b, 16px 119px 0 #26364b; }
    .car-top-label { position: absolute; top: 10px; left: 0; right: 0; color: #26364b; text-align: center; font-size: 11px; font-weight: 700; letter-spacing: .06em; }
    .field { display: block; font-size: 14px; font-weight: 700; }
    .units { color: var(--muted); font-weight: 400; }
    .coolant-control { display: flex; align-items: center; gap: 8px; margin-top: 5px; }
    .coolant-control input { width: 108px; margin: 0; text-align: center; font-size: 20px; font-weight: 700; }
    .coolant-control span { white-space: nowrap; font-size: 15px; font-weight: 700; }
    .coolant-entry-row { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 10px; }
    .coolant-options { display: flex; flex-wrap: wrap; gap: 7px; }
    .battery-options { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 7px; margin-top: 10px; }
    .pressure-profiles { margin: 0 0 10px; }
    .pressure-profiles .choice span { min-width: 148px; }
    .pressure-profiles strong { font-weight: 800; }
    .pressure-declined-choice { display: block; align-self: end; }
    .pressure-declined-choice span { display: flex; width: 100%; min-height: 43px; align-items: center; justify-content: center; }
    #tirePressureItem.is-declined .pressure-profiles,
    #tirePressureItem.is-declined .pressure-input { opacity: 0.48; filter: grayscale(1); }
    input:disabled, select:disabled { color: #667181; background: #eef2f5; }
    button {
      width: 100%;
      padding: 15px;
      border: 0;
      border-radius: 9px;
      color: #fff;
      background: var(--blue);
      font: 700 17px Arial, sans-serif;
      cursor: pointer;
    }
    button.new-checklist { margin-top: 10px; background: var(--green); }
    button.reset-form {
      margin-top: 10px;
      padding: 10px;
      border: 1px solid #b8c1cb;
      color: #5c1c24;
      background: transparent;
      font-size: 14px;
    }
    .edit-link { display: block; margin-top: 13px; color: #526174; text-align: center; font-size: 13px; font-weight: 700; text-decoration: underline; }
    #resultSection { display: none; }
    #result {
      min-height: 310px;
      font-family: Consolas, "Courier New", monospace;
      font-size: 14px;
      line-height: 1.65;
    }
    #copyMessage {
      min-height: 20px;
      margin: 10px 0;
      padding: 10px;
      border-radius: 8px;
      color: #075d2a;
      background: #e6f7eb;
      text-align: center;
      font-size: 15px;
      font-weight: 700;
    }
    #copyMessage:empty { margin: 0; padding: 0; background: transparent; }
    .copy-confirmation {
      position: fixed;
      z-index: 100;
      inset: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      background: rgba(8, 105, 51, 0.96);
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transition: opacity 0.16s ease, visibility 0.16s linear;
    }
    .copy-confirmation.visible {
      visibility: visible;
      opacity: 1;
      animation: copy-flash 0.55s ease-out 2;
    }
    .copy-confirmation-card {
      width: min(100%, 650px);
      padding: 30px 22px;
      border: 5px solid #fff;
      border-radius: 20px;
      color: #fff;
      background: #0d7338;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.34);
      text-align: center;
    }
    .copy-confirmation-check {
      display: grid;
      place-items: center;
      width: 86px;
      height: 86px;
      margin: 0 auto 14px;
      border: 5px solid #fff;
      border-radius: 50%;
      font-size: 57px;
      font-weight: 700;
      line-height: 1;
    }
    .copy-confirmation-title { font-size: clamp(38px, 10vw, 72px); font-weight: 800; letter-spacing: 0.035em; line-height: 1; }
    .copy-confirmation-detail { margin-top: 13px; font-size: clamp(17px, 4vw, 24px); font-weight: 700; }
    @keyframes copy-flash {
      50% { background: rgba(25, 156, 75, 0.98); }
    }
    @media (prefers-reduced-motion: reduce) {
      .copy-confirmation, .copy-confirmation.visible { transition: none; animation: none; }
    }
    @media (max-width: 620px) {
      .measurement-grid, .measurement-grid.four { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .choices { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .choice span { width: 100%; min-width: 0; }
    }
    @media (max-width: 390px) {
      .tire-map { grid-template-columns: minmax(85px, 1fr) 100px minmax(85px, 1fr); gap: 10px 8px; }
      .car-top { width: 92px; height: 235px; }
      .car-top::before, .car-top::after { height: 50px; }
      .car-top::before { top: 34px; left: -18px; box-shadow: 0 101px 0 #26364b; }
      .car-top::after { top: 34px; right: -18px; box-shadow: 0 101px 0 #26364b; }
      .tire-map.is-dually .car-top::before { box-shadow: 0 101px 0 #26364b, -16px 101px 0 #26364b; }
      .tire-map.is-dually .car-top::after { box-shadow: 0 101px 0 #26364b, 16px 101px 0 #26364b; }
      .tire-position { font-size: 11px; }
    }
  </style>
</head>
<body>
  <main>
    <h1>Oil Change Checklist</h1>
    <p class="intro">Complete every inspection, then copy the finished work-order story.</p>
    <div class="progress" id="progress">0 OF 12 INSPECTIONS COMPLETE</div>

    <form id="checklist" novalidate autocomplete="off">
      <div id="sections"></div>
      <button type="submit">GENERATE WORK-ORDER STORY</button>
      <button type="button" class="reset-form" id="resetButton">RESET FORM</button>
    </form>

    <section id="resultSection" class="section">
      <h2>Work-Order Story</h2>
      <p class="section-note">Copy and paste this directly into the work order.</p>
      <textarea id="result" readonly></textarea>
      <p id="copyMessage" role="status" aria-live="polite"></p>
      <button type="button" id="copyButton">COPY STORY</button>
      <button type="button" class="new-checklist" id="newButton">START NEW CHECKLIST</button>
      <a href="#" class="edit-link" id="editLink">EDIT THIS CHECKLIST</a>
    </section>
  </main>

  <div id="copyConfirmation" class="copy-confirmation" role="status" aria-live="assertive" aria-atomic="true" aria-hidden="true">
    <div class="copy-confirmation-card">
      <div class="copy-confirmation-check" aria-hidden="true">✓</div>
      <div class="copy-confirmation-title">STORY COPIED</div>
      <div id="copyConfirmationDetail" class="copy-confirmation-detail">READY TO PASTE</div>
    </div>
  </div>

  <script>
    const sections = [
      {
        title: 'Service and Fluids',
        note: 'Mark the actual result. “Out of spec” requires a description.',
        coolantProtection: true,
        items: [
          { id: 'oilReset', label: 'Oil-life monitor reset', options: ['YES', 'NO', 'N/A'], detailOn: ['NO'], lines: { YES: 'OIL LIFE MONITOR RESET.', 'N/A': 'OIL LIFE MONITOR RESET IS NOT APPLICABLE.' }, failed: 'OIL LIFE MONITOR WAS NOT RESET', suggestions: { NO: ['Monitor could not be reset', 'Reset option not available', 'Warning message remains on display'] } },
          { id: 'washerFluid', label: 'Washer fluid', options: ['TOPPED UP', 'FULL', 'OUT OF SPEC', 'N/A'], detailOn: ['OUT OF SPEC'], lines: { 'TOPPED UP': 'WASHER FLUID TOPPED UP.', FULL: 'WASHER FLUID LEVEL IS FULL.', 'N/A': 'WASHER FLUID SERVICE IS NOT APPLICABLE.' }, failed: 'WASHER FLUID REQUIRES ATTENTION', suggestions: { 'OUT OF SPEC': ['Washer fluid leaking', 'Washer pump inoperative', 'Reservoir damaged or empty'] } },
          { id: 'otherFluids', label: 'All other fluid levels', options: ['ALL GOOD', 'OUT OF SPEC', 'N/A'], detailOn: ['OUT OF SPEC'], lines: { 'ALL GOOD': 'ALL OTHER FLUID LEVELS ARE WITHIN SPECIFICATION.', 'N/A': 'INSPECTION OF OTHER FLUID LEVELS IS NOT APPLICABLE.' }, failed: 'OTHER FLUID LEVELS REQUIRE ATTENTION', suggestions: { 'OUT OF SPEC': ['Coolant level low', 'Brake fluid level low', 'Power-steering fluid level low'] } }
        ]
      },
      {
        title: 'Air Filters',
        note: 'Record the filter condition, replacement, or a declined inspection.',
        items: [
          { id: 'cabinAirFilter', label: 'Cabin air filter', options: ['GOOD', 'BAD', 'REPLACED', 'CUSTOMER DECLINED CHECK'], detailOn: ['BAD'], lines: { GOOD: 'CABIN AIR FILTER IS IN GOOD CONDITION.', REPLACED: 'CABIN AIR FILTER REPLACED.', 'CUSTOMER DECLINED CHECK': 'CUSTOMER DECLINED CABIN AIR FILTER INSPECTION.' }, failed: 'CABIN AIR FILTER REQUIRES ATTENTION', suggestions: { BAD: ['Filter heavily soiled', 'Filter restricted', 'Filter damaged or deformed'] } },
          { id: 'engineAirFilter', label: 'Engine air filter', options: ['GOOD', 'BAD', 'REPLACED', 'CUSTOMER DECLINED CHECK'], detailOn: ['BAD'], lines: { GOOD: 'ENGINE AIR FILTER IS IN GOOD CONDITION.', REPLACED: 'ENGINE AIR FILTER REPLACED.', 'CUSTOMER DECLINED CHECK': 'CUSTOMER DECLINED ENGINE AIR FILTER INSPECTION.' }, failed: 'ENGINE AIR FILTER REQUIRES ATTENTION', suggestions: { BAD: ['Filter heavily soiled', 'Filter restricted', 'Filter damaged or torn'] } }
        ]
      },
      {
        title: 'Visual and Underhood Inspection',
        note: 'Describe every concern instead of using a generic failure note.',
        items: [
          { id: 'beltsHoses', label: 'Belts and hoses', options: ['GOOD', 'OUT OF SPEC', 'N/A'], detailOn: ['OUT OF SPEC'], lines: { GOOD: 'BELTS AND HOSES ARE IN GOOD CONDITION.', 'N/A': 'BELT AND HOSE INSPECTION IS NOT APPLICABLE.' }, failed: 'BELTS AND/OR HOSES REQUIRE ATTENTION', suggestions: { 'OUT OF SPEC': ['Serpentine belt cracked', 'Coolant hose seeping at clamp', 'Hose soft or bulging'] } },
          { id: 'windshield', label: 'Windshield condition', options: ['GOOD', 'CRACKED / DAMAGED'], detailOn: ['CRACKED / DAMAGED'], lines: { GOOD: 'WINDSHIELD IS FREE OF CRACKS OR DAMAGE.' }, failed: 'WINDSHIELD REQUIRES ATTENTION', suggestions: { 'CRACKED / DAMAGED': ['Chip on driver side', 'Chip on passenger side', 'Crack across lower windshield'] } },
          { id: 'wipers', label: 'Wiper condition and operation', options: ['GOOD', 'OUT OF SPEC', 'N/A', 'CUSTOMER DECLINED'], detailOn: ['OUT OF SPEC'], lines: { GOOD: 'WIPERS ARE IN GOOD CONDITION WITH NO STREAKING OR CRACKING.', 'N/A': 'WIPER INSPECTION IS NOT APPLICABLE.', 'CUSTOMER DECLINED': 'CUSTOMER DECLINED WIPER OPERATION TEST.' }, failed: 'WIPERS REQUIRE ATTENTION', suggestions: { 'OUT OF SPEC': ['Streaking on driver side', 'Wiper blade rubber torn', 'Wiper blade does not clear windshield'] } },
          { id: 'lights', label: 'All exterior lights and horn', options: ['GOOD', 'OUT OF SPEC', 'N/A', 'CUSTOMER DECLINED'], detailOn: ['OUT OF SPEC'], lines: { GOOD: 'ALL EXTERIOR LIGHTS AND HORN ARE OPERATING PROPERLY.', 'N/A': 'EXTERIOR LIGHT AND HORN INSPECTION IS NOT APPLICABLE.', 'CUSTOMER DECLINED': 'CUSTOMER DECLINED EXTERIOR LIGHT AND HORN TEST.' }, failed: 'ONE OR MORE EXTERIOR LIGHTS OR THE HORN REQUIRE ATTENTION', suggestions: { 'OUT OF SPEC': ['Left low beam inoperative', 'Brake light inoperative', 'License-plate light inoperative', 'Horn inoperative'] } },
          { id: 'frontEnd', label: 'Front end lubrication', options: ['GREASED', 'N/A', 'CANNOT GREASE'], detailOn: ['CANNOT GREASE'], lines: { GREASED: 'FRONT END GREASED.', 'N/A': 'FRONT-END LUBRICATION IS NOT APPLICABLE.' }, failed: 'FRONT END COULD NOT BE GREASED', suggestions: { 'CANNOT GREASE': ['Torn outer tie-rod boot', 'Torn ball-joint boot', 'Grease fitting damaged or missing'] } }
        ]
      },
      {
        title: 'Tires and Battery',
        note: 'Enter actual measurements; these are intentionally required.',
        items: [],
        tireItems: [
          { id: 'tireCondition', label: 'Tire condition', options: ['NO CONCERN', 'UNEVEN WEAR', 'DAMAGE / OTHER'], detailOn: ['UNEVEN WEAR', 'DAMAGE / OTHER'], lines: {}, failed: 'TIRE CONDITION', includeAnswerInDetail: true, suggestions: { 'UNEVEN WEAR': ['Inner shoulder wear', 'Outer shoulder wear', 'Cupping or scalloping', 'Feathering'], 'DAMAGE / OTHER': ['Sidewall damage', 'Tire bulge', 'Tread separation', 'Nail or screw in tread'] } },
          { id: 'tireRotation', label: 'Recommend Tire Rotation?', options: ['NO', 'YES', 'CUSTOMER DECLINED'], detailOn: [], lines: { YES: 'TIRE ROTATION RECOMMENDED TODAY.', 'CUSTOMER DECLINED': 'TIRE ROTATION RECOMMENDED TODAY; CUSTOMER DECLINED.' } }
        ],
        measurements: true
      },
      {
        title: 'Leak Inspection',
        note: 'If a leak is found, identify the area and condition.',
        items: [
          { id: 'leaks', label: 'Visible fluid leaks', options: ['NO LEAKS FOUND', 'LEAK FOUND'], detailOn: ['LEAK FOUND'], lines: { 'NO LEAKS FOUND': 'NO VISIBLE FLUID LEAKS WERE FOUND.' }, failed: 'A FLUID LEAK WAS FOUND', suggestions: { 'LEAK FOUND': ['Oil leak at front of engine', 'Coolant seeping at hose clamp', 'Recommend further diagnosis'] } }
        ]
      },
      {
        title: 'Technician IDs',
        note: 'Enter the four-digit upper and lower technician numbers.',
        items: [],
        technicianIds: true
      }
    ];

    const allItems = sections.flatMap(section => [
      ...section.items,
      ...(section.tireItems || [])
    ]);
    const sectionContainer = document.getElementById('sections');
    let copyConfirmationTimer;
    const treadDepthOptions = [''].concat(Array.from({ length: 21 }, (_, value) => value))
      .map(value => `<option value="${value}">${value === '' ? 'SELECT' : value}</option>`).join('');

    function createChoice(item, option) {
      const choiceClass = item.id === 'tireRotation' ? 'choice tire-rotation-choice' : 'choice';
      return `<label class="${choiceClass}"><input type="radio" name="${item.id}" value="${option}"><span>${option}</span></label>`;
    }
    function renderSuggestionSets(item) {
      return Object.entries(item.suggestions || {}).map(([answer, examples]) => `
        <p class="suggestion-set" data-answer="${answer}" hidden><strong>Examples:</strong> ${examples.join('; ')}.</p>`).join('');
    }
    function renderInspectionItem(item) {
      const rotationCompletedControl = item.id === 'tireRotation' ? `
          <div class="rotation-completed" id="rotationCompletedWrap">
            <label class="choice"><input type="checkbox" id="tireRotationCompleted" value="COMPLETED"><span>TIRE ROTATION COMPLETED TODAY</span></label>
          </div>` : '';
      return `
        <div class="item">
          <div class="item-label">${item.label}</div>
          <div class="choices">${item.options.map(option => createChoice(item, option)).join('')}</div>
          ${rotationCompletedControl}
          <div class="detail" id="${item.id}Detail">
            <label>${item.detailLabel || 'Required concern description'}
              <textarea id="${item.id}Description" rows="2" placeholder="DESCRIBE THE CONDITION OR RECOMMENDATION"></textarea>
            </label>

    const standardTreadIds = ['treadDriverFront', 'treadPassengerFront', 'treadDriverRear', 'treadPassengerRear'];

      treadDriverFront: 'treadPassengerFront',

      treadPassengerFront: false,
      treadPassengerRear: false,

    };

      [['treadDriverFront', 'treadDriverRear'], ['treadPassengerFront', 'treadPassengerRear']].forEach(([front, rear]) => {
        const frontValue = document.getElementById(front).value;
        document.getElementById(front).value = document.getElementById(rear).value;
        document.getElementById(rear).value = frontValue;
      });
      const passengerFrontWasModified = passengerTreadModified.treadPassengerFront;
      passengerTreadModified.treadPassengerFront = passengerTreadModified.treadPassengerRear;
      passengerTreadModified.treadPassengerRear = passengerFrontWasModified;

    function updateDuallyMode() {
      const dually = isDually();
      const tireMap = document.getElementById('tireMap');
      const treadAll = document.getElementById('treadAll');
      const completed = document.getElementById('tireRotationCompleted');
      tireMap.classList.toggle('is-dually', dually);
      document.getElementById('rotationCompletedWrap').hidden = dually;
      document.getElementById('treadAllLabel').textContent = dually ? 'SAME ON ALL SIX TIRES' : 'SAME ON ALL FOUR TIRES';
      treadAll.setAttribute('aria-label', `Same tire tread for all ${dually ? 'six' : 'four'} tires in 32nds`);
      document.getElementById('treadDriverRear').setAttribute('aria-label', dually ? 'Driver rear outer tire tread in 32nds' : 'Driver rear tire tread in 32nds');
      document.getElementById('treadPassengerRear').setAttribute('aria-label', dually ? 'Passenger rear outer tire tread in 32nds' : 'Passenger rear tire tread in 32nds');
      if (dually && completed.checked) {
        completed.checked = false;
        rotateStandardTreadDepths();
      }
      if (dually && treadAll.value) {
        duallyTreadIds.forEach(id => { document.getElementById(id).value = treadAll.value; });
        resetPassengerTreadModificationFlags();

    function buildTreadDepthStory() {
      const prefix = isTireRotationCompleted() ? 'TREAD DEPTH AFTER ROTATION' : 'TREAD DEPTH';
      const positions = [
        `LF ${text('treadDriverFront')}/32`,
        `RF ${text('treadPassengerFront')}/32`,
        isDually() ? `LR OUTER ${text('treadDriverRear')}/32` : `LR ${text('treadDriverRear')}/32`,
        isDually() ? `LR INNER ${text('treadDriverRearInner')}/32` : `RR ${text('treadPassengerRear')}/32`
      ];
      if (isDually()) {
        positions.push(`RR OUTER ${text('treadPassengerRear')}/32`, `RR INNER ${text('treadPassengerRearInner')}/32`);
      }
      return `${prefix}: ${positions.join(', ')}.`;
    }
    const pressureIds = ['pressureFront', 'pressureRear'];
    function getCoolantTestStatus() {
      if (document.getElementById('coolantCannotTest').checked) return 'CANNOT TEST';
      if (document.getElementById('coolantCustomerDeclined').checked) return 'CUSTOMER DECLINED';
      return '';
    }
    function getBatteryTestStatus() {
      if (document.getElementById('batteryCannotTest').checked) return 'CANNOT TEST';
      if (document.getElementById('batteryCustomerDeclined').checked) return 'CUSTOMER DECLINED';
      return '';
    }
    function selectedTirePressureProfile() {
      return document.querySelector('input[name="tirePressureProfile"]:checked');
    }
    function applyTirePressureProfile(profile) {
      if (!profile) return;
      const values = [profile.dataset.front, profile.dataset.rear];
      pressureIds.forEach((id, index) => {
        const field = document.getElementById(id);
        field.value = values[index];
        field.dataset.defaultValue = values[index];
        field.dataset.usingDefault = 'true';
      });
    }
    function updateTirePressureDeclinedState() {
      const declined = document.getElementById('tirePressureDeclined').checked;
      document.querySelectorAll('input[name="tirePressureProfile"]').forEach(control => {
        control.disabled = declined;
      });
      pressureIds.forEach(id => { document.getElementById(id).disabled = declined; });
      document.getElementById('tirePressureItem').classList.toggle('is-declined', declined);
    }
    function restoreDefaultValue(field) {
      if (!field.dataset.defaultValue) return false;
      field.value = field.dataset.defaultValue;
      field.dataset.usingDefault = 'true';
      return true;
    }
    function formatBatteryVoltage(value, finalize = false) {
      const digits = value.replace(/\D/g, '').slice(0, 4);
      if (digits.length === 4) return `${digits.slice(0, 2)}.${digits.slice(2)}`;
      if (digits.length === 3) {
        const oneDecimal = `${digits.slice(0, 2)}.${digits.slice(2)}`;
        return finalize ? `${oneDecimal}0` : oneDecimal;
      }
      return digits;
    }
    function updateCoolantTestState() {
      const coolantProtection = document.getElementById('coolantProtection');
      const status = getCoolantTestStatus();
      document.getElementById('coolantCannotTest').disabled = false;
      document.getElementById('coolantCustomerDeclined').disabled = false;
      coolantProtection.disabled = Boolean(status);
      if (status) {
        coolantProtection.value = '';
      } else if (!coolantProtection.value) {
        restoreDefaultValue(coolantProtection);
      }
    }
    function updateBatteryTestState() {
      const fields = [
        document.getElementById('batteryVoltage'),
        document.getElementById('batteryResultCca'),
        document.getElementById('testCcaSetting')
      ];
      const status = getBatteryTestStatus();
      const cannotTest = status === 'CANNOT TEST';
      document.getElementById('batteryCannotTest').disabled = false;
      document.getElementById('batteryCustomerDeclined').disabled = false;
      fields.forEach(field => { field.disabled = Boolean(status); });
      document.getElementById('batteryCannotTestDetail').classList.toggle('visible', status === 'CANNOT TEST');
      if (!cannotTest) document.getElementById('batteryCannotTestReason').value = '';
      if (!status) {
        const setting = document.getElementById('testCcaSetting');
        if (!setting.value) restoreDefaultValue(setting);
      }
    }
    function restoreDefaultEntryFlags() {
      ['coolantProtection', 'testCcaSetting'].forEach(id => {
        document.getElementById(id).dataset.usingDefault = 'true';
      });
      applyTirePressureProfile(selectedTirePressureProfile());
    }
    function resetChecklist() {
      document.getElementById('checklist').reset();
      resetPassengerTreadModificationFlags();
      restoreDefaultEntryFlags();
      updateDuallyMode();
      updateTirePressureDeclinedState();
      updateCoolantTestState();
      updateBatteryTestState();
      document.querySelectorAll('.detail.visible').forEach(detail => detail.classList.remove('visible'));
      document.querySelectorAll('.suggestion-set').forEach(set => { set.hidden = true; });
      document.getElementById('result').value = '';
      setCopyMessage('');
      updateProgress();

    function updateSuggestions(item, answer) {
      const container = document.getElementById(`${item.id}Suggestions`);
      if (!container) return;
      container.querySelectorAll('.suggestion-set').forEach(set => {
        set.hidden = set.dataset.answer !== answer;
      });
    }
    updateDuallyMode();
    updateProgress();
    document.addEventListener('change', event => {
      if (event.target.id === 'duallyToggle') {
        updateDuallyMode();
        updateProgress();
        return;
      }
      if (event.target.id === 'tireRotationCompleted') {
        if (!isDually()) rotateStandardTreadDepths();
        updateProgress();
        return;
      }
      if (event.target.id === 'treadAll') {
        if (event.target.value) {
          activeTreadIds().forEach(id => { document.getElementById(id).value = event.target.value; });
          resetPassengerTreadModificationFlags();
        }
        return;
      }
      if (Object.prototype.hasOwnProperty.call(driverToPassengerTread, event.target.id)) {
        const passengerId = driverToPassengerTread[event.target.id];
        if (!passengerTreadModified[passengerId]) {
          document.getElementById(passengerId).value = event.target.value;
        }
        document.getElementById('treadAll').value = '';
        return;
      }
      if (Object.prototype.hasOwnProperty.call(passengerTreadModified, event.target.id)) {
        passengerTreadModified[event.target.id] = true;
        document.getElementById('treadAll').value = '';
        return;
      }
      if (activeTreadIds().includes(event.target.id)) {
        document.getElementById('treadAll').value = '';
        return;
      }
      if (event.target.id === 'coolantCannotTest' || event.target.id === 'coolantCustomerDeclined') {

          document.getElementById(event.target.id === 'coolantCannotTest' ? 'coolantCustomerDeclined' : 'coolantCannotTest').checked = false;
        }
        updateCoolantTestState();
        return;
      }
      if (event.target.id === 'batteryCannotTest' || event.target.id === 'batteryCustomerDeclined') {

          document.getElementById(event.target.id === 'batteryCannotTest' ? 'batteryCustomerDeclined' : 'batteryCannotTest').checked = false;
        }

        return;

    document.addEventListener('focusin', event => {

        event.target.dataset.usingDefault = 'false';

          if (section.coolantProtection && item.id === 'washerFluid') {
            const coolantStatus = getCoolantTestStatus();
            lines.push(coolantStatus === 'CANNOT TEST'
              ? 'COOLANT FREEZE PROTECTION: CANNOT BE TESTED.'
              : coolantStatus === 'CUSTOMER DECLINED'
                ? 'CUSTOMER DECLINED COOLANT FREEZE PROTECTION TEST.'
                : `COOLANT FREEZE PROTECTION: -${text('coolantProtection')}°C.`);
          }
        });
        if (section.measurements) {
          if (isTireRotationCompleted()) lines.push('TIRE ROTATION COMPLETED TODAY.');
          lines.push(buildTreadDepthStory());
          (section.tireItems || []).forEach(item => appendItemStory(item, lines));
          if (document.getElementById('tirePressureDeclined').checked) {
            lines.push('CUSTOMER DECLINED TIRE PRESSURE ADJUSTMENT.');
          } else {
            lines.push(`TIRE PRESSURES: FRONT ${text('pressureFront')} PSI; REAR ${text('pressureRear')} PSI.`);
          }
          const batteryStatus = getBatteryTestStatus();
          lines.push(batteryStatus === 'CANNOT TEST'
            ? `BATTERY TEST: CANNOT BE TESTED — ${detailText('batteryCannotTestReason')}.`
            : batteryStatus === 'CUSTOMER DECLINED'
              ? 'CUSTOMER DECLINED BATTERY TEST.'
              : `BATTERY TEST: ${text('batteryVoltage')} V; RESULT: ${text('batteryResultCca')} CCA; TESTED AT: ${text('testCcaSetting')} CCA.`);
        }
        if (section.technicianIds) {
          lines.push(`UT: ${text('upperTech')}`);
          lines.push(`LT: ${text('lowerTech')}`);
        }
      });

      document.getElementById('result').value = lines.join('\n').toUpperCase();
      document.getElementById('checklist').style.display = 'none';
      document.getElementById('progress').style.display = 'none';
      document.getElementById('resultSection').style.display = 'block';
      document.getElementById('resultSection').scrollIntoView({ behavior: 'smooth', block: 'start' });
    });

    document.getElementById('copyButton').addEventListener('click', () => {
      const result = document.getElementById('result');
      result.focus();
      result.select();
      document.execCommand('copy');
      showCopyConfirmation();
      setCopyMessage('STORY COPIED');
    });
    document.getElementById('editLink').addEventListener('click', event => {
      event.preventDefault();
      document.getElementById('resultSection').style.display = 'none';
      document.getElementById('checklist').style.display = 'block';
      document.getElementById('progress').style.display = 'block';
      setCopyMessage('');
      window.scrollTo({ top: 0, behavior: 'smooth' });
    });
    document.getElementById('resetButton').addEventListener('click', () => {
      if (!confirm('Reset this checklist? All entered values will be cleared.')) return;
      resetChecklist();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    });
    document.getElementById('newButton').addEventListener('click', () => {
      resetChecklist();
      document.getElementById('resultSection').style.display = 'none';
      document.getElementById('checklist').style.display = 'block';
      document.getElementById('progress').style.display = 'block';
      window.scrollTo({ top: 0, behavior: 'smooth' });
    });
  </script>
</body>
</html>
