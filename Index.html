<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <style>
    :root {
      --blue: #125cbd;
      --green: #12753a;
      --amber: #a65a00;
      --red: #bd2020;
      --ink: #18212c;
      --muted: #667181;
      --border: #d4dae1;
      --page: #f2f5f8;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      color: var(--ink);
      background: var(--page);
      font: 16px/1.4 Arial, sans-serif;
    }
    main { max-width: 820px; margin: auto; padding: 18px 12px 46px; }
    h1 { margin: 0; font-size: 26px; }
    .intro { margin: 4px 0 16px; color: var(--muted); }
    .progress {
      position: sticky;
      top: 0;
      z-index: 5;
      margin: 0 -12px 12px;
      padding: 9px 12px;
      color: #fff;
      background: #26364b;
      text-align: center;
      font-size: 14px;
      font-weight: 700;
    }
    .section {
      margin: 12px 0;
      padding: 16px;
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 12px;
    }
    h2 { margin: 0 0 4px; font-size: 19px; }
    .section-note { margin: 0 0 12px; color: var(--muted); font-size: 14px; }
    .item { padding: 13px 0; border-top: 1px solid #e5e9ed; }
    .item:first-of-type { border-top: 0; }
    .item-label { margin-bottom: 9px; font-weight: 700; }
    .choices { display: flex; flex-wrap: wrap; gap: 7px; }
    .choice { cursor: pointer; }
    .choice input { position: absolute; opacity: 0; pointer-events: none; }
    .choice span {
      display: inline-block;
      min-width: 92px;
      padding: 10px 12px;
      border: 1px solid #9da8b5;
      border-radius: 8px;
      background: #fff;
      text-align: center;
      font-size: 14px;
      font-weight: 700;
    }
    .choice input:checked + span { color: #fff; background: var(--green); border-color: var(--green); }
    .choice input[value="NO"]:checked + span,
    .choice input[value="OUT OF SPEC"]:checked + span,
    .choice input[value="CRACKED / DAMAGED"]:checked + span,
    .choice input[value="CANNOT GREASE"]:checked + span,
    .choice input[value="POOR"]:checked + span,
    .choice input[value="REPLACE"]:checked + span,
    .choice input[value="LEAK FOUND"]:checked + span { background: var(--red); border-color: var(--red); }
    .choice input[value="N/A"]:checked + span,
    .choice input[value="UNABLE TO TEST"]:checked + span,
    .choice input[value="NOT REQUIRED"]:checked + span { background: #586372; border-color: #586372; }
    .choice input[value="FULL"]:checked + span { background: var(--blue); border-color: var(--blue); }
    .choice input[value="FAIR"]:checked + span,
    .choice input[value="CHARGE & RETEST"]:checked + span { background: var(--amber); border-color: var(--amber); }
    .detail { display: none; margin-top: 10px; padding: 10px; background: #fff3f3; border-radius: 8px; }
    .detail.visible { display: block; }
    .detail label { display: block; color: #8b1717; font-weight: 700; }
    .suggestion-set {
      margin: 8px 0 0;
      color: #667181;
      font-size: 12px;
      font-weight: 400;
      line-height: 1.35;
    }
    .suggestion-set strong { color: #4d596a; }
    input, select, textarea {
      width: 100%;
      margin-top: 5px;
      padding: 10px;
      border: 1px solid #aab4c0;
      border-radius: 8px;
      background: white;
      color: var(--ink);
      font: inherit;
    }
    input:focus, select:focus, textarea:focus { outline: 3px solid #d7e7ff; border-color: var(--blue); }
    .measurement-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
    .measurement-grid.four { grid-template-columns: repeat(4, minmax(0, 1fr)); }
    .tire-map {
      display: grid;
      grid-template-columns: minmax(105px, 1fr) 132px minmax(105px, 1fr);
      grid-template-rows: auto 1fr 1fr;
      align-items: center;
      gap: 12px 16px;
      max-width: 560px;
      margin: 0 auto;
    }
    .tire-map-heading { grid-column: 1 / -1; color: var(--muted); text-align: center; font-size: 13px; font-weight: 700; }
    .tire-position { display: block; text-align: center; font-size: 12px; font-weight: 700; }
    .tread-control { display: flex; align-items: center; gap: 5px; margin-top: 5px; }
    .tread-control select { min-width: 0; margin: 0; text-align: center; font-size: 18px; font-weight: 700; }
    .tread-unit { white-space: nowrap; font-size: 15px; font-weight: 700; }
    .driver-front { grid-column: 1; grid-row: 2; }
    .passenger-front { grid-column: 3; grid-row: 2; }
    .driver-rear { grid-column: 1; grid-row: 3; }
    .passenger-rear { grid-column: 3; grid-row: 3; }
    .car-top {
      position: relative;
      grid-column: 2;
      grid-row: 2 / 4;
      width: 120px;
      height: 270px;
      margin: 0 auto;
      border: 5px solid #41536a;
      border-radius: 48px 48px 34px 34px;
      background: linear-gradient(to bottom, #dce7f3 0 28%, #b8c7d8 28% 32%, #dce7f3 32% 73%, #b8c7d8 73% 77%, #dce7f3 77% 100%);
    }
    .car-top::before, .car-top::after {
      position: absolute;
      width: 13px;
      height: 58px;
      border-radius: 5px;
      background: #26364b;
      content: '';
    }
    .car-top::before { top: 39px; left: -18px; box-shadow: 0 119px 0 #26364b; }
    .car-top::after { top: 39px; right: -18px; box-shadow: 0 119px 0 #26364b; }
    .car-top-label { position: absolute; top: 10px; left: 0; right: 0; color: #26364b; text-align: center; font-size: 11px; font-weight: 700; letter-spacing: .06em; }
    .field { display: block; font-size: 14px; font-weight: 700; }
    .units { color: var(--muted); font-weight: 400; }
    button {
      width: 100%;
      padding: 15px;
      border: 0;
      border-radius: 9px;
      color: #fff;
      background: var(--blue);
      font: 700 17px Arial, sans-serif;
      cursor: pointer;
    }
    button.new-checklist { margin-top: 10px; background: var(--green); }
    button.reset-form {
      margin-top: 10px;
      padding: 10px;
      border: 1px solid #b8c1cb;
      color: #5c1c24;
      background: transparent;
      font-size: 14px;
    }
    .edit-link { display: block; margin-top: 13px; color: #526174; text-align: center; font-size: 13px; font-weight: 700; text-decoration: underline; }
    #resultSection { display: none; }
    #result {
      min-height: 310px;
      font-family: Consolas, "Courier New", monospace;
      font-size: 14px;
      line-height: 1.65;
    }
    #copyMessage { min-height: 20px; margin: 7px 0 0; color: var(--green); text-align: center; font-weight: 700; }
    @media (max-width: 620px) {
      .measurement-grid, .measurement-grid.four { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .choices { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .choice span { width: 100%; min-width: 0; }
    }
    @media (max-width: 390px) {
      .tire-map { grid-template-columns: minmax(85px, 1fr) 100px minmax(85px, 1fr); gap: 10px 8px; }
      .car-top { width: 92px; height: 235px; }
      .car-top::before, .car-top::after { height: 50px; }
      .car-top::before { top: 34px; left: -18px; box-shadow: 0 101px 0 #26364b; }
      .car-top::after { top: 34px; right: -18px; box-shadow: 0 101px 0 #26364b; }
      .tire-position { font-size: 11px; }
    }
  </style>
</head>
<body>
  <main>
    <h1>Oil Change Checklist</h1>
    <p class="intro">Complete every inspection, then copy the finished work-order story.</p>
    <div class="progress" id="progress">0 OF 13 INSPECTIONS COMPLETE</div>

    <form id="checklist" novalidate>
      <div id="sections"></div>
      <button type="submit">GENERATE WORK-ORDER STORY</button>
      <button type="button" class="reset-form" id="resetButton">RESET FORM</button>
    </form>

    <section id="resultSection" class="section">
      <h2>Work-Order Story</h2>
      <p class="section-note">Copy and paste this directly into the work order.</p>
      <textarea id="result" readonly></textarea>
      <button type="button" id="copyButton">COPY STORY</button>
      <button type="button" class="new-checklist" id="newButton">START NEW CHECKLIST</button>
      <a href="#" class="edit-link" id="editLink">EDIT THIS CHECKLIST</a>
      <p id="copyMessage"></p>
    </section>
  </main>

  <script>
    const sections = [
      {
        title: 'Service and Fluids',
        note: 'Mark the actual result. “Out of spec” requires a description.',
        items: [
          { id: 'oilChange', label: 'Oil change completed', options: ['YES', 'NO'], detailOn: ['NO'], lines: { YES: 'OIL CHANGE COMPLETED.' }, failed: 'OIL CHANGE WAS NOT COMPLETED', suggestions: { NO: ['Service deferred or declined', 'Unable to complete due to parts availability', 'Unable to complete due to vehicle condition'] } },
          { id: 'oilReset', label: 'Oil-life monitor reset', options: ['YES', 'NO', 'N/A'], detailOn: ['NO'], lines: { YES: 'OIL LIFE MONITOR RESET.', 'N/A': 'OIL LIFE MONITOR RESET IS NOT APPLICABLE.' }, failed: 'OIL LIFE MONITOR WAS NOT RESET', suggestions: { NO: ['Monitor could not be reset', 'Reset option not available', 'Warning message remains on display'] } },
          { id: 'washerFluid', label: 'Washer fluid', options: ['TOPPED UP', 'FULL', 'OUT OF SPEC', 'N/A'], detailOn: ['OUT OF SPEC'], lines: { 'TOPPED UP': 'WASHER FLUID TOPPED UP.', FULL: 'WASHER FLUID LEVEL IS FULL.', 'N/A': 'WASHER FLUID SERVICE IS NOT APPLICABLE.' }, failed: 'WASHER FLUID REQUIRES ATTENTION', suggestions: { 'OUT OF SPEC': ['Washer fluid leaking', 'Washer pump inoperative', 'Reservoir damaged or empty'] } },
          { id: 'otherFluids', label: 'All other fluid levels', options: ['ALL GOOD', 'OUT OF SPEC', 'N/A'], detailOn: ['OUT OF SPEC'], lines: { 'ALL GOOD': 'ALL OTHER FLUID LEVELS ARE WITHIN SPECIFICATION.', 'N/A': 'INSPECTION OF OTHER FLUID LEVELS IS NOT APPLICABLE.' }, failed: 'OTHER FLUID LEVELS REQUIRE ATTENTION', suggestions: { 'OUT OF SPEC': ['Coolant level low', 'Brake fluid level low', 'Power-steering fluid level low'] } }
        ]
      },
      {
        title: 'Visual and Underhood Inspection',
        note: 'Describe every concern instead of using a generic failure note.',
        items: [
          { id: 'beltsHoses', label: 'Belts and hoses', options: ['GOOD', 'OUT OF SPEC', 'N/A'], detailOn: ['OUT OF SPEC'], lines: { GOOD: 'BELTS AND HOSES ARE IN GOOD CONDITION.', 'N/A': 'BELT AND HOSE INSPECTION IS NOT APPLICABLE.' }, failed: 'BELTS AND/OR HOSES REQUIRE ATTENTION', suggestions: { 'OUT OF SPEC': ['Serpentine belt cracked', 'Coolant hose seeping at clamp', 'Hose soft or bulging'] } },
          { id: 'windshield', label: 'Windshield condition', options: ['GOOD', 'CRACKED / DAMAGED'], detailOn: ['CRACKED / DAMAGED'], lines: { GOOD: 'WINDSHIELD IS FREE OF CRACKS OR DAMAGE.' }, failed: 'WINDSHIELD REQUIRES ATTENTION', suggestions: { 'CRACKED / DAMAGED': ['Chip on driver side', 'Chip on passenger side', 'Crack across lower windshield'] } },
          { id: 'wipers', label: 'Wiper condition and operation', options: ['GOOD', 'OUT OF SPEC', 'N/A'], detailOn: ['OUT OF SPEC'], lines: { GOOD: 'WIPERS ARE IN GOOD CONDITION WITH NO STREAKING OR CRACKING.', 'N/A': 'WIPER INSPECTION IS NOT APPLICABLE.' }, failed: 'WIPERS REQUIRE ATTENTION', suggestions: { 'OUT OF SPEC': ['Streaking on driver side', 'Wiper blade rubber torn', 'Wiper blade does not clear windshield'] } },
          { id: 'lights', label: 'All exterior lights', options: ['GOOD', 'OUT OF SPEC', 'N/A'], detailOn: ['OUT OF SPEC'], lines: { GOOD: 'ALL EXTERIOR LIGHTS ARE OPERATING PROPERLY.', 'N/A': 'EXTERIOR LIGHT INSPECTION IS NOT APPLICABLE.' }, failed: 'ONE OR MORE EXTERIOR LIGHTS REQUIRE ATTENTION', suggestions: { 'OUT OF SPEC': ['Left low beam inoperative', 'Brake light inoperative', 'License-plate light inoperative'] } },
          { id: 'frontEnd', label: 'Front end lubrication', options: ['GREASED', 'N/A', 'CANNOT GREASE'], detailOn: ['CANNOT GREASE'], lines: { GREASED: 'FRONT END GREASED.', 'N/A': 'FRONT-END LUBRICATION IS NOT APPLICABLE.' }, failed: 'FRONT END COULD NOT BE GREASED', suggestions: { 'CANNOT GREASE': ['Torn outer tie-rod boot', 'Torn ball-joint boot', 'Grease fitting damaged or missing'] } }
        ]
      },
      {
        title: 'Tires and Battery',
        note: 'Enter actual measurements; these are intentionally required.',
        items: [],
        tireItems: [
          { id: 'tireCondition', label: 'Tire condition', options: ['GOOD', 'FAIR', 'POOR'], detailOn: ['FAIR', 'POOR'], lines: { GOOD: 'TIRE CONDITION IS GOOD.' }, failed: 'TIRE CONDITION', includeAnswerInDetail: true, suggestions: { FAIR: ['Inner shoulder wear', 'Cupping or feathering', 'Sidewall cracking or bulge'], POOR: ['Tread depth is low', 'Uneven wear present', 'Sidewall cracking or bulge'] } },
          { id: 'tireRotation', label: 'Tire rotation recommended', options: ['YES', 'NO'], detailOn: ['YES'], lines: { NO: 'TIRE ROTATION IS NOT RECOMMENDED.' }, failed: 'TIRE ROTATION IS RECOMMENDED', detailLabel: 'Required recommendation note', suggestions: { YES: ['Rotation due per maintenance schedule', 'Rotation due at this service', 'Recommend rotation to promote even wear'] } }
        ],
        measurements: true,
        batteryResult: { id: 'batteryResult', label: 'Battery test result', options: ['GOOD', 'CHARGE & RETEST', 'REPLACE', 'UNABLE TO TEST'], detailOn: ['CHARGE & RETEST', 'REPLACE', 'UNABLE TO TEST'], lines: {}, failed: 'BATTERY TEST RESULT', includeAnswerInDetail: true, combineWithMeasurements: true, suggestions: { 'CHARGE & RETEST': ['Battery requires charging', 'Low state of charge', 'Retest after charge'], REPLACE: ['Available CCA below test setting', 'Battery failed test', 'Recommend battery replacement'], 'UNABLE TO TEST': ['Terminals corroded', 'Battery not accessible', 'Tester connection unsuccessful'] } }
      },
      {
        title: 'Leak Inspection',
        note: 'If a leak is found, identify the area and condition.',
        items: [
          { id: 'leaks', label: 'Visible fluid leaks', options: ['NO LEAKS FOUND', 'LEAK FOUND'], detailOn: ['LEAK FOUND'], lines: { 'NO LEAKS FOUND': 'NO VISIBLE FLUID LEAKS WERE FOUND.' }, failed: 'A FLUID LEAK WAS FOUND', suggestions: { 'LEAK FOUND': ['Oil leak at front of engine', 'Coolant seeping at hose clamp', 'Recommend further diagnosis'] } }
        ]
      },
      {
        title: 'Technician IDs',
        note: 'Enter the four-digit upper and lower technician numbers.',
        items: [],
        technicianIds: true
      }
    ];

    const allItems = sections.flatMap(section => [
      ...section.items,
      ...(section.tireItems || []),
      ...(section.batteryResult ? [section.batteryResult] : [])
    ]);
    const batteryResultItem = allItems.find(item => item.id === 'batteryResult');
    const sectionContainer = document.getElementById('sections');
    const treadDepthOptions = [''].concat(Array.from({ length: 21 }, (_, value) => value))
      .map(value => `<option value="${value}">${value === '' ? 'SELECT' : value}</option>`).join('');

    function createChoice(item, option) {
      return `<label class="choice"><input type="radio" name="${item.id}" value="${option}"><span>${option}</span></label>`;
    }
    function renderSuggestionSets(item) {
      return Object.entries(item.suggestions || {}).map(([answer, examples]) => `
        <p class="suggestion-set" data-answer="${answer}" hidden><strong>Examples:</strong> ${examples.join('; ')}.</p>`).join('');
    }
    function renderInspectionItem(item) {
      return `
        <div class="item">
          <div class="item-label">${item.label}</div>
          <div class="choices">${item.options.map(option => createChoice(item, option)).join('')}</div>
          <div class="detail" id="${item.id}Detail">
            <label>${item.detailLabel || 'Required concern description'}
              <textarea id="${item.id}Description" rows="2" placeholder="DESCRIBE THE CONDITION OR RECOMMENDATION"></textarea>
            </label>
            <div id="${item.id}Suggestions">${renderSuggestionSets(item)}</div>
          </div>
        </div>`;
    }

    sections.forEach(section => {
      const element = document.createElement('section');
      element.className = 'section';
      element.innerHTML = `<h2>${section.title}</h2><p class="section-note">${section.note}</p>` +
        section.items.map(renderInspectionItem).join('') +
        (section.measurements ? `
          <div class="item">
            <div class="item-label">Tire tread measurements <span class="units">(32NDS)</span></div>
            <div class="tire-map" role="group" aria-label="Top-down vehicle tire tread map">
              <div class="tire-map-heading">FRONT OF VEHICLE ↑</div>
              <label class="tire-position driver-front">DRIVER FRONT<div class="tread-control"><select id="treadDriverFront" aria-label="Driver front tire tread in 32nds">${treadDepthOptions}</select><span class="tread-unit">/32</span></div></label>
              <label class="tire-position passenger-front">PASSENGER FRONT<div class="tread-control"><select id="treadPassengerFront" aria-label="Passenger front tire tread in 32nds">${treadDepthOptions}</select><span class="tread-unit">/32</span></div></label>
              <label class="tire-position driver-rear">DRIVER REAR<div class="tread-control"><select id="treadDriverRear" aria-label="Driver rear tire tread in 32nds">${treadDepthOptions}</select><span class="tread-unit">/32</span></div></label>
              <label class="tire-position passenger-rear">PASSENGER REAR<div class="tread-control"><select id="treadPassengerRear" aria-label="Passenger rear tire tread in 32nds">${treadDepthOptions}</select><span class="tread-unit">/32</span></div></label>
              <div class="car-top" aria-hidden="true"><span class="car-top-label">VEHICLE</span></div>
            </div>
          </div>
          ${(section.tireItems || []).map(renderInspectionItem).join('')}
          <div class="item">
            <div class="item-label">Tire pressure <span class="units">(PSI)</span></div>
            <div class="measurement-grid">
              <label class="field">FRONT<input id="pressureFront" inputmode="decimal"></label>
              <label class="field">REAR<input id="pressureRear" inputmode="decimal"></label>
            </div>
          </div>
          <div class="item">
            <div class="item-label">Battery measurements</div>
            <div class="measurement-grid">
              <label class="field">VOLTAGE <span class="units">(V)</span><input id="batteryVoltage" inputmode="decimal"></label>
              <label class="field">TEST CCA SETTING<input id="testCcaSetting" inputmode="numeric"></label>
              <label class="field">AVAILABLE CCA<input id="availableCca" inputmode="numeric"></label>
            </div>
          </div>` : '') +
        (section.batteryResult ? renderInspectionItem(section.batteryResult) : '') +
        (section.technicianIds ? `
          <div class="measurement-grid">
            <label class="field">UPPER TECH <span class="units">(4 DIGITS)</span><input id="upperTech" class="tech-number" inputmode="numeric" maxlength="4" pattern="[0-9]{4}" autocomplete="off"></label>
            <label class="field">LOWER TECH <span class="units">(4 DIGITS)</span><input id="lowerTech" class="tech-number" inputmode="numeric" maxlength="4" pattern="[0-9]{4}" autocomplete="off"></label>
          </div>` : '');
      sectionContainer.appendChild(element);
    });

    function selected(id) {
      return document.querySelector(`input[name="${id}"]:checked`)?.value || '';
    }
    function text(id) {
      return document.getElementById(id).value.trim().toUpperCase();
    }
    function detailText(id) {
      return text(id).replace(/[.?!]+$/, '');
    }
    function appendItemStory(item, lines) {
      const answer = selected(item.id);
      if (item.combineWithMeasurements) return;
      if (item.lines[answer]) lines.push(item.lines[answer]);
      if (item.detailOn.includes(answer)) {
        const prefix = item.includeAnswerInDetail ? `${item.failed} IS ${answer}:` : `${item.failed}:`;
        lines.push(`${prefix} ${detailText(`${item.id}Description`)}.`);
      }
    }
    function updateProgress() {
      const completed = allItems.filter(item => selected(item.id)).length;
      document.getElementById('progress').textContent = `${completed} OF ${allItems.length} INSPECTIONS COMPLETE`;
    }
    function resetChecklist() {
      document.getElementById('checklist').reset();
      document.querySelectorAll('.detail.visible').forEach(detail => detail.classList.remove('visible'));
      document.querySelectorAll('.suggestion-set').forEach(set => { set.hidden = true; });
      document.getElementById('result').value = '';
      document.getElementById('copyMessage').textContent = '';
      updateProgress();
    }
    function updateSuggestions(item, answer) {
      const container = document.getElementById(`${item.id}Suggestions`);
      if (!container) return;
      container.querySelectorAll('.suggestion-set').forEach(set => {
        set.hidden = set.dataset.answer !== answer;
      });
    }
    updateProgress();
    document.addEventListener('change', event => {
      if (event.target.type !== 'radio') return;
      const item = allItems.find(entry => entry.id === event.target.name);
      if (!item) return;
      document.getElementById(`${item.id}Detail`).classList.toggle('visible', item.detailOn.includes(event.target.value));
      updateSuggestions(item, event.target.value);
      updateProgress();
    });
    document.addEventListener('input', event => {
      if (event.target.classList.contains('tech-number')) {
        event.target.value = event.target.value.replace(/\D/g, '').slice(0, 4);
      }
    });

    function validate() {
      for (const item of allItems) {
        const answer = selected(item.id);
        if (!answer) {
          document.querySelector(`input[name="${item.id}"]`)?.closest('.item').scrollIntoView({ behavior: 'smooth', block: 'center' });
          alert(`SELECT A RESULT FOR: ${item.label.toUpperCase()}`);
          return false;
        }
        if (item.detailOn.includes(answer) && !text(`${item.id}Description`)) {
          const field = document.getElementById(`${item.id}Description`);
          field.focus();
          alert(`ENTER DETAILS FOR: ${item.label.toUpperCase()}`);
          return false;
        }
      }
      const measurements = ['treadDriverFront', 'treadPassengerFront', 'treadDriverRear', 'treadPassengerRear', 'pressureFront', 'pressureRear', 'batteryVoltage', 'testCcaSetting', 'availableCca'];
      for (const id of measurements) {
        if (!text(id)) {
          const field = document.getElementById(id);
          field.focus();
          alert(`ENTER: ${(field.closest('label')?.textContent || id).trim().toUpperCase()}`);
          return false;
        }
      }
      for (const id of ['upperTech', 'lowerTech']) {
        if (!/^\d{4}$/.test(text(id))) {
          const field = document.getElementById(id);
          field.focus();
          alert(`ENTER A FOUR-DIGIT ${(field.closest('label')?.textContent || id).trim().toUpperCase()}`);
          return false;
        }
      }
      return true;
    }

    document.getElementById('checklist').addEventListener('submit', event => {
      event.preventDefault();
      if (!validate()) return;
      const lines = [];
      sections.forEach(section => {
        section.items.forEach(item => appendItemStory(item, lines));
        if (section.measurements) {
          lines.push(`TREAD DEPTH: LF ${text('treadDriverFront')}/32, RF ${text('treadPassengerFront')}/32, LR ${text('treadDriverRear')}/32, RR ${text('treadPassengerRear')}/32.`);
          (section.tireItems || []).forEach(item => appendItemStory(item, lines));
          lines.push(`TIRE PRESSURES: FRONT ${text('pressureFront')} PSI; REAR ${text('pressureRear')} PSI.`);
          const batteryResult = selected('batteryResult');
          let batteryStory = `BATTERY TEST: ${text('batteryVoltage')} V; TEST SETTING: ${text('testCcaSetting')} CCA; AVAILABLE CCA: ${text('availableCca')}; RESULT: ${batteryResult}`;
          if (batteryResultItem.detailOn.includes(batteryResult)) {
            batteryStory += ` — ${detailText('batteryResultDescription')}`;
          }
          lines.push(`${batteryStory}.`);
        }
        if (section.technicianIds) {
          lines.push(`UT: ${text('upperTech')}`);
          lines.push(`LT: ${text('lowerTech')}`);
        }
      });

      document.getElementById('result').value = lines.join('\n').toUpperCase();
      document.getElementById('checklist').style.display = 'none';
      document.getElementById('progress').style.display = 'none';
      document.getElementById('resultSection').style.display = 'block';
      document.getElementById('resultSection').scrollIntoView({ behavior: 'smooth', block: 'start' });
    });

    document.getElementById('copyButton').addEventListener('click', async () => {
      const result = document.getElementById('result');
      try {
        await navigator.clipboard.writeText(result.value);
      } catch (_) {
        result.select();
        document.execCommand('copy');
      }
      document.getElementById('copyMessage').textContent = 'STORY COPIED';
    });
    document.getElementById('editLink').addEventListener('click', event => {
      event.preventDefault();
      document.getElementById('resultSection').style.display = 'none';
      document.getElementById('checklist').style.display = 'block';
      document.getElementById('progress').style.display = 'block';
      document.getElementById('copyMessage').textContent = '';
      window.scrollTo({ top: 0, behavior: 'smooth' });
    });
    document.getElementById('resetButton').addEventListener('click', () => {
      if (!confirm('Reset this checklist? All entered values will be cleared.')) return;
      resetChecklist();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    });
    document.getElementById('newButton').addEventListener('click', () => {
      resetChecklist();
      document.getElementById('resultSection').style.display = 'none';
      document.getElementById('checklist').style.display = 'block';
      document.getElementById('progress').style.display = 'block';
      window.scrollTo({ top: 0, behavior: 'smooth' });
    });
  </script>
</body>
</html>
